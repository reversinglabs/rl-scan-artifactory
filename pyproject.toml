[build-system]
    requires = ["hatchling"]
    build-backend = "hatchling.build"

[project]
    name = "rl-scan-artifactory"
    dynamic = ['version']

    authors = [
      { name="ReversingLabs"},
    ]

    maintainers = [
      { name="ReversingLabs", email="support@reversinglabs.com" },
    ]

    requires-python = ">=3.11"
    dependencies = [
        "requests",
        "python-dateutil",
        "spectra-assure-sdk>=1.0.4",
    ]

    description = "Python package to process files from Artifactory with Spectra Assure."
    readme = "README.md"
    license = "MIT"

    classifiers = [
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Intended Audience :: Developers",
        "Environment :: Console",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Programming Language :: Python :: 3.13",
        "Topic :: Security",
        "Topic :: Software Development :: Libraries :: Python Modules",
    ]

    keywords = [
        "Python",
        "Secure Software",
    ]

[project.scripts]
    rl-scan-artifactory = 'rl_scan_artifactory.main:main'

[project.urls]
    "Bug Tracker" = "https://github.com/reversinglabs/rl-scan-artifactory/issues"
    "Home Page" = "https://github.com/reversinglabs/rl-scan-artifactory"
    "Repository" = "https://github.com/reversinglabs/rl-scan-artifactory"

[tool.hatch.version]
    path = "rl_scan_artifactory/version.py"

[tool.hatch.build]
    only-packages = true

    include = [
        "rl_scan_artifactory/",
    ]

    exclude = [
        "/Old/*",
        "/lib/*",
        "/etc/*",
        "/bin/*",
        "/testdata/*",
        "Makefile",
        ".gitignore",
        "/.gitignore",
        ".env",
        "/tmp/",
        "/tmp2/",
        "/vtmp/",
        "/tools/",
    ]

[tool.pytest.ini_options]
    testpaths = ["tests"]
    xfail_strict = true
    addopts = "-ra --strict-markers"

[tool.ruff]
    target-version = "py311"
    line-length = 120
    exclude = [
        ".direnv",
        ".eggs",
        ".git",
        ".git-rewrite",
        ".mypy_cache",
        ".nox",
        ".pants.d",
        ".pytype",
        ".ruff_cache",
        ".svn",
        ".tox",
        ".venv",
        "__pypackages__",
        "_build",
        "buck-out",
        "build",
        "dist",
        "node_modules",
        "venv",
        "vtmp",
    ]

[tool.ruff.lint.mccabe]
    # nothing in the package exceeds this; it is here so that stays true
    max-complexity = 10

[tool.ruff.lint]
    select = [
        "E",      # pycodestyle errors
        "W",      # pycodestyle warnings
        "F",      # Pyflakes
        "UP",     # pyupgrade
        "C90",    # mccabe complexity, see [tool.ruff.lint.mccabe]
        # "B",      # flake8-bugbear
        "C4",     # flake8-comprehensions
        "I",      # isort
        # "S",      # flake8-bandit
        "T20",    # flake8-print
        "PT",     # flake8-pytest-style
        "Q",      # flake8-quotes
    ]

    ignore = [
        # "B603",
        "S404",
        "T201",  # print found
        "PT028", # Test function parameter has default argument
        "S101",  # Use of `assert` detected
        "S324",  # Probable use of insecure hash functions in `hashlib`: `sha1`
    ]

    # Allow autofix for all enabled rules (when `--fix`) is provided.
    fixable = ["ALL"]
    unfixable = []
    preview = true
